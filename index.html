<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藥品動態條碼掃描與庫存管理 APP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  
  <style>
    #interactive.viewport video, 
    #interactive.viewport canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    @keyframes laserScan {
      0%, 100% { opacity: 0.4; transform: scaleY(0.8); }
      50% { opacity: 1; transform: scaleY(1.2); }
    }
    .laser-line {
      animation: laserScan 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20 text-base">

  <header class="bg-teal-700 text-white p-4 shadow-md text-center text-xl font-bold">
    💊 藥品掃描與庫存管理系統
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. 條碼動態掃描區 -->
    <div class="bg-white p-5 rounded-2xl shadow space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-slate-700 text-lg">📷 Code-128 動態掃描器</h2>
        <span id="scanStatus" class="text-sm px-3 py-1 rounded-full bg-slate-100 text-slate-600 font-semibold">相機已停止</span>
      </div>

      <div id="interactive" class="viewport relative w-full h-72 bg-black rounded-xl overflow-hidden flex items-center justify-center">
        <p id="cameraPlaceholder" class="text-white text-base z-0">請點擊下方按鈕啟動相機</p>
        <div id="scanOverlay" class="absolute z-10 pointer-events-none w-3/4 h-36 border-2 border-rose-500/80 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(244,63,94,0.3)] hidden">
          <div class="laser-line w-full h-0.5 bg-rose-500 shadow-[0_0_8px_#f43f5e]"></div>
          <span class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-rose-400 rounded-tl"></span>
          <span class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-rose-400 rounded-tr"></span>
          <span class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-rose-400 rounded-bl"></span>
          <span class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-rose-400 rounded-br"></span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="startScanner()" class="bg-teal-600 hover:bg-teal-700 text-white py-3.5 rounded-xl font-bold text-base shadow transition">
          ▶ 啟動即時掃描
        </button>
        <button onclick="stopScanner()" class="bg-slate-500 hover:bg-slate-600 text-white py-3.5 rounded-xl font-bold text-base shadow transition">
          ⏹ 關閉相機
        </button>
      </div>

      <div class="pt-2 border-t">
        <div class="flex gap-2">
          <input id="manualBarcode" type="text" placeholder="或手動輸入條碼..." class="flex-1 border px-3.5 py-2.5 rounded-xl text-base focus:ring-2 focus:ring-teal-600 outline-none">
          <button onclick="searchManualBar()" class="bg-slate-700 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-base font-semibold transition">查詢</button>
        </div>
      </div>
    </div>

    <!-- 2. 藥品詳細資訊與編輯卡片 -->
    <div id="medicineCard" class="bg-white p-5 rounded-2xl shadow hidden space-y-4 border border-slate-200">
      
      <!-- 基礎資訊顯示 (順序：英文品名 -> 中文品名 -> 許可證字號) -->
      <div class="flex gap-4 items-start border-b pb-4">
        <img id="medImg" src="" class="w-28 h-28 object-cover rounded-xl border bg-slate-50 flex-shrink-0" alt="藥品圖片">
        <div class="space-y-1.5 flex-1 min-w-0">
          <!-- 1. 英文品名 (置頂) -->
          <h3 id="medEnglishName" class="text-lg font-extrabold text-slate-900 break-words">--</h3>
          <!-- 2. 中文品名 -->
          <p id="medChineseName" class="text-sm font-bold text-slate-600 break-words">--</p>
          <!-- 3. 許可證字號 -->
          <div class="pt-0.5">
            <span class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md inline-block">
              📜 許可證：<span id="medLicenseNo">--</span>
            </span>
          </div>
        </div>
      </div>

      <!-- 狀態顯示 -->
      <div id="restockBadge" class="p-3 rounded-xl text-center font-bold text-base">--</div>

      <!-- 輸入編輯表單區 -->
      <div class="space-y-3.5 pt-1">
        <p class="text-sm text-slate-500 font-bold">資料更新（若無需更新請保持空白）：</p>
        
        <!-- 是否需備貨切換 -->
        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border">
          <span class="text-sm font-bold text-slate-700">是否需備貨：</span>
          <div class="flex gap-2">
            <button type="button" onclick="setRestockFlag(true)" id="btnYes" class="px-4 py-1.5 text-sm rounded-lg font-bold border transition bg-white text-slate-600">是</button>
            <button type="button" onclick="setRestockFlag(false)" id="btnNo" class="px-4 py-1.5 text-sm rounded-lg font-bold border transition bg-white text-slate-600">否</button>
          </div>
        </div>

        <!-- 清點數輸入 -->
        <div>
          <label class="text-sm font-bold text-slate-700">清點數：</label>
          <input id="inputCounted" type="number" placeholder="請輸入清點數..." class="w-full mt-1 border px-3.5 py-2.5 rounded-xl text-base focus:ring-2 focus:ring-teal-600 outline-none">
        </div>

        <!-- 進貨量輸入 (原庫存數) -->
        <div>
          <label class="text-sm font-bold text-slate-700">進貨量：</label>
          <input id="inputPurchaseQty" type="number" placeholder="請輸入進貨量..." class="w-full mt-1 border px-3.5 py-2.5 rounded-xl text-base focus:ring-2 focus:ring-teal-600 outline-none">
        </div>

        <!-- 備考輸入 -->
        <div>
          <label class="text-sm font-bold text-slate-700">備考：</label>
          <input id="inputRemarks" type="text" placeholder="請輸入備忘說明..." class="w-full mt-1 border px-3.5 py-2.5 rounded-xl text-base focus:ring-2 focus:ring-teal-600 outline-none">
        </div>

        <!-- 更新按鈕 -->
        <button onclick="submitUpdate()" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3.5 rounded-xl font-bold text-base shadow-md transition mt-2">
          💾 確認更新至試算表
        </button>
      </div>

    </div>

    <!-- 3. 查看備貨清單按鈕 -->
    <div>
      <button onclick="openRestockModal()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-4 rounded-2xl font-bold text-base shadow flex items-center justify-center gap-2 transition">
        📋 查看目前「需要備貨」藥品清單
      </button>
    </div>

  </main>

  <!-- 備貨清單 Modal -->
  <div id="restockModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-5 w-full max-w-md max-h-[80vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center mb-3 border-b pb-2">
        <h3 class="text-xl font-bold text-slate-800">🛒 需備貨藥品清單</h3>
        <button onclick="closeRestockModal()" class="text-slate-400 hover:text-slate-600 text-3xl font-bold">&times;</button>
      </div>
      <div id="restockListContent" class="overflow-y-auto flex-1 space-y-3 pr-1">
        <p class="text-slate-400 text-center py-6 text-base">載入中...</p>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 請填入您的 GAS Web App API 網址 (/exec)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwqoR-hW_Q6oY07G395Y900kC0Q8X3Q5W20j30kZ0a10Q/exec";
    
    let currentBarcode = null;
    let isScanning = false;
    let currentRestockStatus = false;

    function updateStatus(msg, isError = false) {
      const el = document.getElementById('scanStatus');
      el.innerText = msg;
      el.className = isError 
        ? "text-sm px-3 py-1 rounded-full bg-rose-100 text-rose-800 font-semibold"
        : "text-sm px-3 py-1 rounded-full bg-teal-100 text-teal-800 font-semibold";
    }

    function startScanner() {
      if (isScanning) return;
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: { facingMode: "environment", aspectRatio: { min: 1, max: 2 } }
        },
        decoder: { readers: ["code_128_reader"] },
        locate: true
      }, function(err) {
        if (err) {
          updateStatus("相機啟動失敗", true);
          return;
        }
        Quagga.start();
        isScanning = true;
        document.getElementById('scanOverlay').classList.remove('hidden');
        document.getElementById('cameraPlaceholder').classList.add('hidden');
        updateStatus("📷 請將條碼對準紅線...");
      });
      Quagga.onDetected(onBarcodeDetected);
    }

    function stopScanner() {
      if (isScanning) {
        Quagga.stop();
        isScanning = false;
        document.getElementById('scanOverlay').classList.add('hidden');
        document.getElementById('cameraPlaceholder').classList.remove('hidden');
        updateStatus("相機已停止");
      }
    }

    function onBarcodeDetected(result) {
      if (result && result.codeResult && result.codeResult.code) {
        const code = result.codeResult.code;
        if (code === currentBarcode) return;
        currentBarcode = code;
        document.getElementById('manualBarcode').value = code;
        updateStatus("✅ 掃描成功：" + code);
        if (navigator.vibrate) navigator.vibrate(100);
        stopScanner();
        queryMedicine(code);
      }
    }

    function searchManualBar() {
      const val = document.getElementById('manualBarcode').value.trim();
      if (val) {
        currentBarcode = val;
        queryMedicine(val);
      }
    }

    async function queryMedicine(barcode) {
      updateStatus("資料庫查詢中...");
      try {
        const res = await fetch(`${GAS_API_URL}?action=getMedicine&barcode=${encodeURIComponent(barcode)}`);
        const data = await res.json();
        updateStatus(data.found ? "查詢成功" : "試算表未找到該藥品");
        renderMedicineCard(data);
      } catch (e) {
        updateStatus("查詢失敗", true);
      }
    }

    function renderMedicineCard(data) {
      document.getElementById('medicineCard').classList.remove('hidden');
      document.getElementById('medEnglishName').innerText = data.englishName || "（無英文品名）";
      document.getElementById('medChineseName').innerText = data.chineseName || "（無中文品名）";
      document.getElementById('medLicenseNo').innerText = data.licenseNo || "無";
      document.getElementById('medImg').src = data.imageUrl || "https://via.placeholder.com/150?text=No+Image";

      currentRestockStatus = data.needRestock;
      updateRestockUI();

      document.getElementById('inputCounted').value = "";
      document.getElementById('inputCounted').placeholder = "目前值: " + (data.countedStock !== "" ? data.countedStock : "空白");
      
      document.getElementById('inputPurchaseQty').value = "";
      document.getElementById('inputPurchaseQty').placeholder = "目前值: " + (data.purchaseQty !== "" ? data.purchaseQty : "空白");

      document.getElementById('inputRemarks').value = "";
      document.getElementById('inputRemarks').placeholder = data.remarks !== "" ? data.remarks : "目前無備考";
    }

    function setRestockFlag(status) {
      currentRestockStatus = status;
      updateRestockUI();
    }

    function updateRestockUI() {
      const badge = document.getElementById('restockBadge');
      const btnYes = document.getElementById('btnYes');
      const btnNo = document.getElementById('btnNo');

      if (currentRestockStatus) {
        badge.className = "p-3 rounded-xl text-center font-bold text-base bg-rose-100 text-rose-800 border border-rose-200";
        badge.innerText = "⚠️ 狀態：需要備貨";
        btnYes.className = "px-4 py-1.5 text-sm rounded-lg font-bold border transition bg-rose-600 text-white border-rose-600 shadow";
        btnNo.className = "px-4 py-1.5 text-sm rounded-lg font-bold border transition bg-white text-slate-600 border-slate-200";
      } else {
        badge.className = "p-3 rounded-xl text-center font-bold text-base bg-emerald-100 text-emerald-800 border border-emerald-200";
        badge.innerText = "✅ 狀態：庫存正常（無需備貨）";
        btnYes.className = "px-4 py-1.5 text-sm rounded-lg font-bold border transition bg-white text-slate-600 border-slate-200";
        btnNo.className = "px-4 py-1.5 text-sm rounded-lg font-bold border transition bg-slate-700 text-white border-slate-700 shadow";
      }
    }

    async function submitUpdate() {
      if (!currentBarcode) return;
      
      const counted = document.getElementById('inputCounted').value.trim();
      const purchaseQty = document.getElementById('inputPurchaseQty').value.trim();
      const remarks = document.getElementById('inputRemarks').value.trim();

      updateStatus("正在同步更新至試算表...");
      
      try {
        const url = `${GAS_API_URL}?action=updateMedicine&barcode=${encodeURIComponent(currentBarcode)}&needRestock=${currentRestockStatus}&countedStock=${encodeURIComponent(counted)}&purchaseQty=${encodeURIComponent(purchaseQty)}&remarks=${encodeURIComponent(remarks)}`;
        
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.found) {
          updateStatus("💾 資料更新成功！");
          alert("資料已成功同步更新至 Google 試算表！");
          renderMedicineCard(data);
        } else {
          alert("更新失敗：" + (data.error || "未知錯誤"));
        }
      } catch (e) {
        updateStatus("更新發生錯誤", true);
        alert("網路連線或伺服器錯誤：" + e.message);
      }
    }

    function openRestockModal() {
      document.getElementById('restockModal').classList.remove('hidden');
      fetch(`${GAS_API_URL}?action=fetchRestockList`)
        .then(res => res.json())
        .then(list => {
          const container = document.getElementById('restockListContent');
          if (list.length === 0) {
            container.innerHTML = '<p class="text-emerald-600 text-center py-6 font-semibold text-base">🎉 目前沒有需要備貨的藥品！</p>';
            return;
          }
          container.innerHTML = list.map(item => `
            <div class="flex items-center gap-3 p-3.5 bg-slate-50 rounded-xl border border-slate-200">
              <img src="${item.imageUrl || 'https://via.placeholder.com/80'}" class="w-14 h-14 object-cover rounded-lg border bg-white flex-shrink-0">
              <div class="min-w-0 flex-1">
                <p class="font-extrabold text-slate-900 text-base truncate">${item.englishName}</p>
                <p class="text-sm font-bold text-slate-600 truncate">${item.chineseName}</p>
                <div class="flex gap-3 text-xs text-slate-500 mt-1">
                  <span>清點: <strong class="text-rose-600">${item.countedStock !== "" ? item.countedStock : '無'}</strong></span>
                  <span>進貨量: <strong class="text-teal-600">${item.purchaseQty !== "" ? item.purchaseQty : '無'}</strong></span>
                </div>
              </div>
            </div>
          `).join('');
        })
        .catch(err => {
          document.getElementById('restockListContent').innerHTML = '<p class="text-rose-600 text-center py-6 text-base">載入清單失敗</p>';
        });
    }

    function closeRestockModal() {
      document.getElementById('restockModal').classList.add('hidden');
    }
  </script>
</body>
</html>
