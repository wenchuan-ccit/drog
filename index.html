<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藥品動態條碼掃描 APP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Quagga2 條碼鏡頭引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  
  <style>
    /* 1. 修正相機畫面與畫布的滿版縮放比例 */
    #interactive.viewport video, 
    #interactive.viewport canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 2. 雷射紅線掃描動畫效果 */
    @keyframes laserScan {
      0%, 100% { opacity: 0.4; transform: scaleY(0.8); }
      50% { opacity: 1; transform: scaleY(1.2); }
    }
    .laser-line {
      animation: laserScan 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">

  <!-- 頁頭資訊欄 -->
  <header class="bg-teal-700 text-white p-4 shadow-md text-center text-lg font-bold">
    💊 藥品掃描與備貨管理
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. 即時相機動態視窗區塊 -->
    <div class="bg-white p-5 rounded-2xl shadow space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="font-bold text-slate-700">📷 即時動態掃描 Code-128</h2>
        <span id="scanStatus" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-semibold">相機已停止</span>
      </div>

      <!-- 相機視窗（含紅線對焦遮罩） -->
      <div id="interactive" class="viewport relative w-full h-72 bg-black rounded-xl overflow-hidden flex items-center justify-center">
        <!-- 未開相機時的提示文字 -->
        <p id="cameraPlaceholder" class="text-white text-sm z-0">請點擊下方按鈕啟動相機</p>

        <!-- 🔴 中央紅線與對焦輔助框 (z-index 上浮確保不被影片遮蓋) -->
        <div id="scanOverlay" class="absolute z-10 pointer-events-none w-3/4 h-36 border-2 border-rose-500/80 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(244,63,94,0.3)] hidden">
          <!-- 雷射紅線 -->
          <div class="laser-line w-full h-0.5 bg-rose-500 shadow-[0_0_8px_#f43f5e]"></div>
          
          <!-- 四角 L 型邊框裝飾 -->
          <span class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-rose-400 rounded-tl"></span>
          <span class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-rose-400 rounded-tr"></span>
          <span class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-rose-400 rounded-bl"></span>
          <span class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-rose-400 rounded-br"></span>
        </div>
      </div>

      <!-- 控制按鈕區 -->
      <div class="grid grid-cols-2 gap-2">
        <button onclick="startScanner()" class="bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-xl font-bold text-sm shadow transition">
          ▶ 啟動即時掃描
        </button>
        <button onclick="stopScanner()" class="bg-slate-500 hover:bg-slate-600 text-white py-3 rounded-xl font-bold text-sm shadow transition">
          ⏹ 關閉相機
        </button>
      </div>

      <!-- 手動輸入備案 -->
      <div class="pt-2 border-t">
        <div class="flex gap-2">
          <input id="manualBarcode" type="text" placeholder="手動輸入條碼..." class="flex-1 border px-3 py-2 rounded-xl text-sm focus:ring-2 focus:ring-teal-600 outline-none">
          <button onclick="searchManualBar()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">查詢</button>
        </div>
      </div>
    </div>

    <!-- 2. 藥品結果顯示卡片區 -->
    <div id="medicineCard" class="bg-white p-5 rounded-2xl shadow hidden space-y-4 border border-slate-200">
      <div class="flex gap-4 items-start">
        <img id="medImg" src="" class="w-24 h-24 object-cover rounded-xl border bg-slate-50 flex-shrink-0" alt="藥品圖片">
        <div class="space-y-1 flex-1 min-w-0">
          <h3 id="medChineseName" class="text-lg font-extrabold text-slate-900 break-words">--</h3>
          <p id="medEnglishName" class="text-xs font-medium text-slate-500 italic break-words">--</p>
          <span class="text-[11px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md inline-block">📜 <span id="medLicenseNo">--</span></span>
        </div>
      </div>
      <div id="restockBadge" class="p-2.5 rounded-xl text-center font-bold text-sm">--</div>
      <div class="grid grid-cols-2 gap-2 border-t pt-3">
        <button onclick="setRestock(true)" class="bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-xl text-sm font-bold shadow transition">📌 標記備貨</button>
        <button onclick="setRestock(false)" class="bg-slate-500 hover:bg-slate-600 text-white py-2 rounded-xl text-sm font-bold shadow transition">✅ 取消標記</button>
      </div>
    </div>

  </main>

  <script>
    // ⚠️ 請填入您的 GAS Web App API 網址 (/exec)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzkNQstP1tSk17HhKfGqvfaF5gGqdFLUQJq3Jt4s7SOnPlJdgmCddYChOi6aZFf3Dtc/exec";
    
    let currentBarcode = null;
    let isScanning = false;

    function updateStatus(msg, isError = false) {
      const el = document.getElementById('scanStatus');
      el.innerText = msg;
      el.className = isError 
        ? "text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-800 font-semibold"
        : "text-xs px-2.5 py-1 rounded-full bg-teal-100 text-teal-800 font-semibold";
    }

    // 啟動 Quagga2 即時相機鏡頭
    function startScanner() {
      if (isScanning) return;
      
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: "environment", // 優先使用後置主鏡頭
            aspectRatio: { min: 1, max: 2 }
          }
        },
        decoder: {
          readers: ["code_128_reader"] // 專防 Code-128 條碼
        },
        locate: true
      }, function(err) {
        if (err) {
          console.error(err);
          updateStatus("相機啟動失敗", true);
          alert("無法存取相機，請確認已授權瀏覽器存取權限！");
          return;
        }
        Quagga.start();
        isScanning = true;
        
        // 顯示對焦輔助框並隱藏預設提示文字
        document.getElementById('scanOverlay').classList.remove('hidden');
        document.getElementById('cameraPlaceholder').classList.add('hidden');
        updateStatus("📷 請將條碼對準紅線...");
      });

      // 監聽掃描結果
      Quagga.onDetected(onBarcodeDetected);
    }

    // 停止相機與關閉對焦框
    function stopScanner() {
      if (isScanning) {
        Quagga.stop();
        isScanning = false;
        document.getElementById('scanOverlay').classList.add('hidden');
        document.getElementById('cameraPlaceholder').classList.remove('hidden');
        updateStatus("相機已停止");
      }
    }

    // 辨識成功處理
    function onBarcodeDetected(result) {
      if (result && result.codeResult && result.codeResult.code) {
        const code = result.codeResult.code;
        
        // 避免防手震連續重複辨識
        if (code === currentBarcode) return;
        
        currentBarcode = code;
        document.getElementById('manualBarcode').value = code;
        updateStatus("✅ 掃描成功：" + code);
        
        // 手機震動回饋 (若硬體支援)
        if (navigator.vibrate) navigator.vibrate(100);

        // 辨識完成後自動關閉鏡頭並查詢資料庫
        stopScanner();
        queryMedicine(code);
      }
    }

    // 手動輸入條碼查詢
    function searchManualBar() {
      const val = document.getElementById('manualBarcode').value.trim();
      if (val) {
        currentBarcode = val;
        queryMedicine(val);
      }
    }

    // 發送 HTTP 請求向 GAS 查詢資料
    async function queryMedicine(barcode) {
      updateStatus("資料庫查詢中...");
      try {
        const res = await fetch(`${GAS_API_URL}?action=getMedicine&barcode=${encodeURIComponent(barcode)}`);
        const data = await res.json();
        updateStatus(data.found ? "查詢成功" : "試算表未找到該藥品");
        renderMedicineCard(data);
      } catch (e) {
        updateStatus("查詢失敗", true);
      }
    }

    // 渲染藥品卡片 UI
    function renderMedicineCard(data) {
      document.getElementById('medicineCard').classList.remove('hidden');
      document.getElementById('medChineseName').innerText = data.chineseName || "--";
      document.getElementById('medEnglishName').innerText = data.englishName || "--";
      document.getElementById('medLicenseNo').innerText = data.licenseNo || "--";
      document.getElementById('medImg').src = data.imageUrl || "";

      const badge = document.getElementById('restockBadge');
      if (data.needRestock) {
        badge.className = "p-2.5 rounded-xl text-center font-bold text-sm bg-rose-100 text-rose-800 border border-rose-200";
        badge.innerText = "⚠️ 狀態：需要備貨";
      } else {
        badge.className = "p-2.5 rounded-xl text-center font-bold text-sm bg-emerald-100 text-emerald-800 border border-emerald-200";
        badge.innerText = "✅ 狀態：庫存正常（無需備貨）";
      }
    }

    // 更新備貨標記狀態
    async function setRestock(flag) {
      if (!currentBarcode) return;
      updateStatus("更新中...");
      try {
        const res = await fetch(`${GAS_API_URL}?action=updateRestock&barcode=${encodeURIComponent(currentBarcode)}&flag=${flag}`);
        const data = await res.json();
        updateStatus("狀態更新成功");
        renderMedicineCard(data);
      } catch (e) {
        alert("更新失敗，請檢查網路狀態");
      }
    }
  </script>
</body>
</html>
